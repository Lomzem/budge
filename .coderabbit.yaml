# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews each feature-slice PR. The merge rule lives in AGENTS.md ("Pull requests").
language: en-US

reviews:
  profile: assertive
  # Request changes for blocking findings, and approve once they are resolved.
  # (Replaces the deprecated `request_changes_workflow: true`.)
  auto_approvals:
    enabled: true
    # An author's `@coderabbitai approve` must not stand in for a review.
    allow_author_approval: false
  auto_review:
    enabled: false
    drafts: false
    # Dependency bumps are checked by CI; skipping them saves the free plan's rate limit.
    ignore_usernames:
      - renovate[bot]
  path_filters:
    - '!bun.lock'
    - '!convex/_generated/**'
  path_instructions:
    - path: '**'
      instructions: |
        This repo is public. Flag any real-looking financial data anywhere in the diff:
        real merchant or payee names, real-looking balances or amounts copied from a bank,
        personal names, account or routing numbers, Plaid access tokens, Item IDs, or account IDs,
        and Clerk secret keys. Test data must use invented payees and amounts.
        Follow AGENTS.md, and use the vocabulary defined in GLOSSARY.md for domain concepts.
    - path: 'src/**/*.svelte'
      instructions: |
        Check the "Design plan" and "Constraints" sections of .scratch/bank-sync-ux/spec.md, which
        supersede the UI rules in .scratch/v1-spec: shadcn-svelte components and semantic HTML;
        theme color tokens; status shown as color plus words; WCAG 2.2 AA in dark and light themes;
        no layout shifts; responsive from 320 px. Every control has a keyboard path and an
        accessible name that names its action and target. A "more actions" menu may show only an
        ellipsis; below the md container width, search, filter, clear and add controls may show
        only their icon; every other control keeps a visible label. Small counts and status words
        beside a navigation item, row or task are allowed, and the Budget's `Needs you` tasks are
        rounded links, each a sentence with one action. The sign-in page may say in one sentence
        what Budge is for. Bounded groups such as a bank connection, a Category group, a settings
        section or the Category inspector may sit on a sheet surface; lists inside them stay ruled
        rows. Shared UI state lives in context-provided classes in .svelte.ts modules, never
        in module-level $state. Components must not execute Effects from the `effect` package
        with `Effect.run*` APIs. This rule does not ban Svelte's `$effect` rune.
    - path: '.scratch/**'
      instructions: |
        These are planning documents: the spec, tickets, and decisions. Review them lightly as
        prose. Comment only on contradictions with other documents, broken links, or real-looking
        financial data. Skip style and wording nitpicks.
