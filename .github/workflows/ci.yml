name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request supersedes its older run. Every push to main runs to the end,
  # because its secret scan covers only that push's commits.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The app reads its Convex URL at build time, so typechecking needs one. Nothing serves it.
      PUBLIC_CONVEX_URL: http://127.0.0.1:3210
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Check generated Convex code
        run: bun run codegen:check
      - name: Format check
        run: bun run format:check
      - name: ESLint
        run: bun run lint
      - name: shadcn-lint
        run: bun run lint:ui
      - name: Typecheck
        run: bun run typecheck
      - name: Vitest
        run: bun run test

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false

  e2e:
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Report every shard, so one flaky journey doesn't hide the others' results.
      fail-fast: false
      matrix:
        # Each entry gets its own runner and its own local Convex backend. The capacity contract
        # runs beside the browser journeys, which are split by test across four shards.
        suite: [capacity, 1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install Playwright browser
        if: matrix.suite != 'capacity'
        # Headless runs use only the headless shell, whose libraries the runner image already has.
        run: bunx playwright install --only-shell chromium
      # An anonymous local deployment: no Convex account, no cloud quota, never production.
      # The first push fails until the required env vars are set.
      # The test user is the owner of this backend.
      - name: Start local Convex backend
        env:
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_DEV_JWT_ISSUER_DOMAIN }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
        run: |
          for name in CLERK_JWT_ISSUER_DOMAIN E2E_CLERK_USER_ID; do
            [ -n "${!name}" ] || { echo "::error::$name is empty: add its Clerk development secret to the repo."; exit 1; }
          done
          CONVEX_AGENT_MODE=anonymous bunx convex dev --typecheck disable > convex.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:3210/version > /dev/null && grep -q '^PUBLIC_CONVEX_URL=' .env.local 2>/dev/null && break
            sleep 2
          done
          printf 'CLERK_JWT_ISSUER_DOMAIN=%s\nBUDGE_OWNER_SUBJECT=%s\n' "$CLERK_JWT_ISSUER_DOMAIN" "$E2E_CLERK_USER_ID" |
            bunx convex env set --force
          # `convex dev` misses an env var change that lands before it watches env vars, but always re-pushes when a file it read changes.
          touch convex/auth.config.ts
          for _ in $(seq 1 60); do
            grep -q 'Convex functions ready' convex.log && exit 0
            sleep 2
          done
          cat convex.log
          exit 1
      - name: Import capacity contract
        if: matrix.suite == 'capacity'
        timeout-minutes: 6
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEV_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_DEV_JWT_ISSUER_DOMAIN }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
        run: bun run capacity:check
      - name: Playwright
        if: matrix.suite != 'capacity'
        timeout-minutes: 6
        # The Clerk development instance and its one hand-made test user. Never production:
        # global setup refuses any other credentials.
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEV_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_DEV_JWT_ISSUER_DOMAIN }}
          E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          SHARD: ${{ matrix.suite }}
        # Playwright passes an empty shard, so a shard that lists no tests fails here instead.
        run: |
          bun run test:e2e --shard="$SHARD" --list > shard-tests.txt
          grep -q '^Total: [1-9]' shard-tests.txt || { echo "::error::Shard $SHARD lists no tests."; exit 1; }
          bun run test:e2e --shard="$SHARD"
      # The repo is public, so its artifacts are too. Browser traces and screenshots can show
      # Clerk session tokens and the test user's email, and capacity's raw run records hold
      # backend log entries, so only the backend log and the capacity table are kept.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ strategy.job-index }}
          path: |
            convex.log
            test-results/capacity/*/table.md
          if-no-files-found: ignore
          retention-days: 7

  # Fails CI when a job runs over budget, after every job has finished, so its results stay.
  # Raising the budget needs the owner's approval: see "CI time budget" in AGENTS.md.
  budget:
    needs: [checks, gitleaks, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    env:
      BUDGET_SECONDS: 300
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check job times
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name != "budget" and .conclusion != "skipped" and .completed_at != null)
              | [.name, ((.completed_at | fromdate) - (.started_at | fromdate))] | @tsv' > times.tsv
          [ -s times.tsv ] || { echo "::error title=CI time budget::Found no job times for this run."; exit 1; }
          unfinished=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name != "budget" and .completed_at == null) | .name')
          [ -z "$unfinished" ] || { echo "::error title=CI time budget::Add these jobs to budget's needs: $unfinished"; exit 1; }
          {
            echo "| Job | Seconds |"
            echo "|---|---:|"
            sort -t$'\t' -k2,2rn times.tsv | awk -F'\t' '{ print "| " $1 " | " $2 " |" }'
            echo
            echo "Budget: ${BUDGET_SECONDS} s per job."
          } >> "$GITHUB_STEP_SUMMARY"
          over=0
          while IFS=$'\t' read -r name seconds; do
            if [ "$seconds" -gt "$BUDGET_SECONDS" ]; then
              echo "::error title=CI time budget::$name took ${seconds} s, over the ${BUDGET_SECONDS} s budget. A rerun keeps the old times of jobs it skips, so rerun every job: gh run rerun $GITHUB_RUN_ID. See \"CI time budget\" in AGENTS.md."
              over=1
            fi
          done < times.tsv
          exit "$over"
