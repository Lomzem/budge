name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Format check
        run: bun run format:check
      - name: ESLint
        run: bun run lint
      - name: shadcn-lint
        run: bun run lint:ui
      - name: Typecheck
        run: bun run typecheck
      - name: Vitest
        run: bun run test

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: false

  e2e:
    runs-on: ubuntu-latest
    # The Clerk development instance and its one hand-made test user. Never production.
    env:
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_DEV_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_DEV_SECRET_KEY }}
      CLERK_JWT_ISSUER_DOMAIN: ${{ secrets.CLERK_DEV_JWT_ISSUER_DOMAIN }}
      E2E_CLERK_USER_ID: ${{ secrets.E2E_CLERK_USER_ID }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      # An anonymous local deployment: no Convex account, no cloud quota, never production.
      # The first push fails until the required env vars are set; `convex dev` then retries it.
      # The test user is the owner of this backend.
      - name: Start local Convex backend
        run: |
          for name in PUBLIC_CLERK_PUBLISHABLE_KEY CLERK_SECRET_KEY CLERK_JWT_ISSUER_DOMAIN E2E_CLERK_USER_ID E2E_CLERK_USER_EMAIL; do
            [ -n "${!name}" ] || { echo "::error::$name is empty: add its Clerk development secret to the repo."; exit 1; }
          done
          CONVEX_AGENT_MODE=anonymous bunx convex dev --typecheck disable > convex.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf http://127.0.0.1:3210/version > /dev/null && grep -q '^PUBLIC_CONVEX_URL=' .env.local 2>/dev/null && break
            sleep 2
          done
          bunx convex env set CLERK_JWT_ISSUER_DOMAIN "$CLERK_JWT_ISSUER_DOMAIN"
          bunx convex env set BUDGE_OWNER_SUBJECT "$E2E_CLERK_USER_ID"
          for _ in $(seq 1 60); do
            grep -q 'Convex functions ready' convex.log && exit 0
            sleep 2
          done
          cat convex.log
          exit 1
      - name: Playwright
        run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            convex.log
          retention-days: 7
